
services:
  db:
    image: postgres:18
    container_name: globalone-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: globalone
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalone"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: globalone-app
    env_file:
      - .env
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: globalone
      PGUSER: postgres
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
